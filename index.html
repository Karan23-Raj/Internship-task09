<!DOCTYPE html>
<html>
<head>
    <title>Neon Color Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <p class="tag">✦ INTERACTIVE EXPERIENCE ✦</p>

        <h1>NEON COLORS</h1>
        <p class="subtitle">Choose your vibes.</p>

        <h3>Select Your Color</h3>

        <div class="buttons">
            <button id="red" class="red">● RED</button>
            <button id="green" class="green">● GREEN</button>
            <button id="blue" class="blue">● BLUE</button>
            <button id="yellow" class="yellow">● YELLOW</button>
        </div>

        <button id="random">✦ RANDOM COLOR</button>

        <button id="reset">↻ RESET</button>

        <div class="result">
            <p>CURRENT COLOR</p>
            <h2 id="colorName">DEFAULT</h2>
        </div>

        <p class="footer">POWERED BY HTML • CSS • JS</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
